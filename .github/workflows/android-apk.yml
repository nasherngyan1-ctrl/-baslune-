name: Build Android Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-debug-apk:
    name: Test & Build BASLUNE OS Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up and verify Android SDK
        shell: bash
        run: |
          set -euo pipefail

          # Use a single SDK root and unify ANDROID_HOME / ANDROID_SDK_ROOT to avoid conflicts.
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ -n "${ANDROID_HOME:-}" ] && [ -n "${ANDROID_SDK_ROOT:-}" ] && [ "$ANDROID_HOME" != "$ANDROID_SDK_ROOT" ]; then
            echo "WARNING: ANDROID_HOME ($ANDROID_HOME) differs from ANDROID_SDK_ROOT ($ANDROID_SDK_ROOT); unifying to $SDK_ROOT"
          fi
          if [ ! -d "$SDK_ROOT" ]; then
            echo "ERROR: Android SDK root directory does not exist: $SDK_ROOT" >&2
            exit 1
          fi

          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          # Locate existing cmdline-tools sdkmanager without installing a duplicate SDK.
          SDKMANAGER=""
          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          else
            CANDIDATE="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1 || true)"
            if [ -n "$CANDIDATE" ] && [ -x "$CANDIDATE" ]; then
              SDKMANAGER="$CANDIDATE"
            elif command -v sdkmanager >/dev/null 2>&1; then
              SDKMANAGER="$(command -v sdkmanager)"
            fi
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: Could not locate executable sdkmanager under $SDK_ROOT/cmdline-tools" >&2
            ls -la "$SDK_ROOT" || true
            ls -la "$SDK_ROOT/cmdline-tools" 2>/dev/null || true
            exit 1
          fi

          CMDLINE_BIN="$(dirname "$SDKMANAGER")"
          echo "$CMDLINE_BIN" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          export PATH="$CMDLINE_BIN:$SDK_ROOT/platform-tools:$PATH"

          echo "=== Environment Diagnostics ==="
          echo "JAVA_HOME=${JAVA_HOME:-<unset>}"
          java -version 2>&1
          echo "SDK_ROOT=$SDK_ROOT"
          echo "SDKMANAGER=$SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --version || true

          print_sdk_diagnostics() {
            local reason="$1"
            local log_file="$2"
            echo "::error::$reason"
            echo "=== Captured sdkmanager output ==="
            cat "$log_file" || true
            echo "=== SDK & Java Environment ==="
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
            echo "JAVA_HOME=${JAVA_HOME:-<unset>}"
            java -version 2>&1 || true
            echo "=== Installed SDK directories ==="
            ls -la "$SDK_ROOT/cmdline-tools" 2>/dev/null || true
            ls -la "$SDK_ROOT/platforms" 2>/dev/null || true
            ls -la "$SDK_ROOT/build-tools" 2>/dev/null || true
            ls -la "$SDK_ROOT/licenses" 2>/dev/null || true
            echo "=== sdkmanager --list_installed ==="
            "$SDKMANAGER" --sdk_root="$SDK_ROOT" --list_installed 2>&1 || true
            echo "=== Matching remote SDK packages (36 / platform-tools) ==="
            "$SDKMANAGER" --sdk_root="$SDK_ROOT" --list 2>&1 | grep -E "platforms;android-36|build-tools;36|platform-tools" || true
          }

          LIC_LOG="$(mktemp)"
          INSTALL_LOG="$(mktemp)"
          trap 'rm -f "$LIC_LOG" "$INSTALL_LOG"' EXIT

          # Accept Android SDK licenses safely (ignoring SIGPIPE from 'yes').
          set +e
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >"$LIC_LOG" 2>&1
          LIC_STATUS=${PIPESTATUS[1]}
          set -e
          set -o pipefail
          cat "$LIC_LOG"
          if [ "$LIC_STATUS" -ne 0 ]; then
            print_sdk_diagnostics "sdkmanager --licenses failed with exit code $LIC_STATUS" "$LIC_LOG"
            exit "$LIC_STATUS"
          fi

          # Install exact packages matching app/build.gradle.kts (compileSdk 36 minorApiLevel 1) and AGP 9.1.1 (build-tools 36.0.0).
          set +e
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install \
            "platform-tools" \
            "platforms;android-36.1" \
            "build-tools;36.0.0" >"$INSTALL_LOG" 2>&1
          INSTALL_STATUS=${PIPESTATUS[1]}
          set -e
          set -o pipefail
          cat "$INSTALL_LOG"
          if [ "$INSTALL_STATUS" -ne 0 ]; then
            print_sdk_diagnostics "sdkmanager --install failed with exit code $INSTALL_STATUS" "$INSTALL_LOG"
            exit "$INSTALL_STATUS"
          fi

          for required_dir in \
            "$SDK_ROOT/platform-tools" \
            "$SDK_ROOT/platforms/android-36.1" \
            "$SDK_ROOT/build-tools/36.0.0" \
            "$SDK_ROOT/licenses"; do
            if [ ! -d "$required_dir" ]; then
              print_sdk_diagnostics "Required Android SDK directory missing after setup: $required_dir" "$INSTALL_LOG"
              exit 1
            fi
          done

          echo "=== Verified Installed Android SDK Packages ==="
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --list_installed

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Ensure CI debug keystore exists
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run Unit & Robolectric Tests
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Print Test Failure Summary (on failure)
        if: failure()
        shell: bash
        run: |
          echo "=== Test XML Results ==="
          for f in app/build/test-results/testDebugUnitTest/TEST-*.xml; do
            if [ -f "$f" ]; then
              echo "--- $f ---"
              cat "$f"
            fi
          done

      - name: Upload Test Reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: baslune-os-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 7

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify Debug APK output
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: Expected APK not found at $APK_PATH" >&2
            exit 1
          fi
          ls -lh "$APK_PATH"

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: baslune-os-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
